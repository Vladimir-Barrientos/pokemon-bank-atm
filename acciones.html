<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon Bank - Acciones</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7">

        <div class="pantalla-atm">

          <div class="encabezado-banco">
            <h1>Pokemon Bank</h1>
          </div>

          <!-- Tarjeta con el nombre del dueño de la cuenta y su numero
               de cuenta, tal como pide la guia del proyecto -->
          <div class="tarjeta-usuario">
            <h3 id="nombreUsuario">...</h3>
            <p id="numeroCuentaUsuario">...</p>
            <div class="saldo-grande" id="saldoActual">$0.00</div>
            <p style="margin:0; font-size:13px;">Saldo disponible</p>
          </div>

          <!-- Links para ir al historial y al grafico -->
          <div class="d-flex justify-content-between mb-3">
            <a href="historial.html" class="btn btn-outline-primary btn-sm">Ver historial</a>
            <a href="grafico.html" class="btn btn-outline-primary btn-sm">Ver grafico</a>
          </div>

          <!-- Botones de las transacciones -->
          <button class="btn btn-atm btn-amarillo" data-toggle="modal" data-target="#modalDeposito">
            Depositar
          </button>

          <button class="btn btn-atm btn-amarillo" data-toggle="modal" data-target="#modalRetiro">
            Retirar
          </button>

          <button class="btn btn-atm btn-amarillo" id="btnConsultarSaldo">
            Consultar saldo
          </button>

          <button class="btn btn-atm btn-amarillo" data-toggle="modal" data-target="#modalPago">
            Pagar servicios
          </button>

          <hr>

          <button class="btn btn-atm btn-outline-danger" id="btnSalir">
            Salir
          </button>

        </div>

      </div>
    </div>
  </div>

  <!-- ============ MODAL: DEPOSITO ============ -->
  <!-- Un "modal" de bootstrap es una ventanita que aparece encima
       de la pagina. Aqui pedimos el monto a depositar. -->
  <div class="modal fade" id="modalDeposito" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Depositar dinero</h5>
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body">
          <label>Monto a depositar ($)</label>
          <input type="number" id="montoDeposito" class="form-control" min="1" step="0.01" placeholder="Ej. 100.00">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btnConfirmarDeposito">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ MODAL: RETIRO ============ -->
  <div class="modal fade" id="modalRetiro" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Retirar dinero</h5>
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body">
          <label>Monto a retirar ($)</label>
          <input type="number" id="montoRetiro" class="form-control" min="1" step="0.01" placeholder="Ej. 50.00">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btnConfirmarRetiro">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ MODAL: PAGO DE SERVICIOS ============ -->
  <div class="modal fade" id="modalPago" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Pagar servicios</h5>
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body">
          <label>Tipo de servicio</label>
          <!-- Las 4 opciones que pide la guia del proyecto -->
          <select id="tipoServicio" class="form-control mb-3">
            <option value="Energia electrica">Energia electrica</option>
            <option value="Internet">Internet</option>
            <option value="Telefonia">Telefonia</option>
            <option value="Agua potable">Agua potable</option>
          </select>

          <label>Monto a pagar ($)</label>
          <input type="number" id="montoPago" class="form-control" min="1" step="0.01" placeholder="Ej. 25.00">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" id="btnConfirmarPago">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ LIBRERIAS (JS) ============ -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert@2.1.2/dist/sweetalert.min.js"></script>

  <script src="js/data.js"></script>
  <script src="js/acciones.js"></script>

</body>
</html>
