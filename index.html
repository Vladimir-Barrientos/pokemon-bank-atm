<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Esto hace que la pagina se vea bien en celulares (responsive) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokemon Bank - Iniciar Sesion</title>

  <!-- Bootstrap 4 (framework CSS que pide la guia del proyecto) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

  <!-- Nuestro CSS propio con los estilos de Pokemon Bank -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- container de bootstrap para centrar todo -->
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">

        <!-- Esta es la "pantalla" del cajero -->
        <div class="pantalla-atm">

          <!-- Encabezado con el nombre del banco -->
          <div class="encabezado-banco">
            <h1>Pokemon Bank</h1>
          </div>

          <p class="text-center text-muted">
            Ingrese su PIN de 4 digitos para continuar
          </p>

          <!-- Formulario de login. Usamos un <form> para que al
               darle "Enter" tambien funcione el boton. -->
          <form id="formLogin">

            <!-- Campo donde el usuario escribe el PIN -->
            <div class="form-group">
              <input
                type="password"
                id="inputPin"
                class="form-control caja-pin"
                maxlength="4"
                placeholder="----"
                inputmode="numeric"
                autocomplete="off"
              >
              <!-- Aqui va a aparecer el mensaje de error si el PIN
                   esta mal escrito (lo llena validate.js / JS) -->
              <small id="mensajeError" class="form-text text-danger text-center" style="display:none;">
                El PIN debe tener exactamente 4 numeros.
              </small>
            </div>

            <!-- Boton para enviar el PIN -->
            <button type="submit" class="btn btn-amarillo btn-atm">
              Ingresar
            </button>
          </form>

          <p class="text-center text-muted" style="font-size: 13px; margin-top: 15px;">
            Usuario de prueba: PIN 1234
          </p>

        </div>

      </div>
    </div>
  </div>

  <!-- ============ LIBRERIAS (JS) ============ -->

  <!-- jQuery y Bootstrap JS (bootstrap los necesita para los modales) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- SweetAlert: lo usamos para mostrar el mensaje de "PIN incorrecto" -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert@2.1.2/dist/sweetalert.min.js"></script>

  <!-- Nuestros archivos propios -->
  <script src="js/data.js"></script>
  <script src="js/login.js"></script>

</body>
</html>
