<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokémon Bank - Gráfico</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-6">

        <div class="pantalla-atm">

          <div class="encabezado-banco">
            <h1>Pokémon Bank</h1>
          </div>

          <h4 class="text-center mb-4">Análisis de transacciones</h4>

          <!-- Aqui Chart.js va a dibujar el grafico -->
          <canvas id="graficoTransacciones" width="400" height="300"></canvas>

          <p id="mensajeSinDatosGrafico" class="text-center text-muted mt-3" style="display:none;">
            Todavía no hay transacciones para graficar.
          </p>

          <div class="text-center mt-4">
            <a href="acciones.html" class="btn btn-outline-success">Volver</a>
          </div>

        </div>

      </div>
    </div>
  </div>

  <!-- Librerias (JS) -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Chart.js: para hacer el grafico de tipos de transaccion -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>

  <script src="js/data.js"></script>
  <script src="js/grafico.js"></script>

</body>
</html>
