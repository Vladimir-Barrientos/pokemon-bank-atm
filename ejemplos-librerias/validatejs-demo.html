<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejemplo - ValidateJS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body class="p-5">

  <!--
    Ejemplo suelto de ValidateJS. Esta librería sirve para
    validar formularios de una forma más ordenada, en vez de
    escribir muchos "if" a mano.
  -->

  <h2>Ejemplo 4: ValidateJS</h2>
  <p>Esta librería sirve para validar los datos de un formulario (ej. que un campo no esté vacío, o que tenga cierto largo).</p>

  <div class="form-group" style="max-width: 300px;">
    <label>PIN (debe tener 4 números)</label>
    <input type="text" id="campoPin" class="form-control" placeholder="Ej. 1234">
  </div>

  <button class="btn btn-primary" id="btnValidar">Validar</button>

  <p id="resultadoValidacion" class="mt-3"></p>

  <!-- Cargo ValidateJS desde un CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/validate.js/0.13.1/validate.min.js"></script>

  <script>
    document.getElementById("btnValidar").addEventListener("click", function () {

      // Tomo el valor que escribió el usuario
      var valorPin = document.getElementById("campoPin").value;

      // Armo un "objeto" con el dato a validar (así lo pide la librería)
      var datosAValidar = {
        pin: valorPin
      };

      // Armo las "reglas" de validación para ese dato
      var reglas = {
        pin: {
          presence: { allowEmpty: false, message: "no puede estar vacío" },
          length: { is: 4, message: "debe tener exactamente 4 números" },
          numericality: { onlyInteger: true, message: "debe ser solo números" }
        }
      };

      // validate.validate() regresa "undefined" si todo está bien,
      // o un objeto con los errores si algo está mal.
      var errores = validate(datosAValidar, reglas);

      var parrafoResultado = document.getElementById("resultadoValidacion");

      if (errores) {
        // Si hay errores, los muestro en pantalla
        parrafoResultado.className = "text-danger";
        parrafoResultado.textContent = "Error: PIN " + errores.pin[0];
      } else {
        parrafoResultado.className = "text-success";
        parrafoResultado.textContent = "El PIN es válido.";
      }
    });
  </script>

</body>
</html>
